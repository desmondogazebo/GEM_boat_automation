name: Build and release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version and prepare release notes
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(?<version>(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[0-9A-Za-z.-]+)?)$') {
            throw "Tag '$tag' is not a Semantic Versioning tag (expected vMAJOR.MINOR.PATCH[-prerelease])."
          }
          $version = $Matches.version

          $notes = 'Download DailyShipHelper.exe from the release assets. The launcher requests administrator permission and creates an isolated .venv beside the executable on first use; Python 3.11 or later is required.'
          $previousTag = git describe --tags --abbrev=0 "$tag^" 2>$null
          $range = if ($LASTEXITCODE -eq 0 -and $previousTag) { "$previousTag..$tag" } else { $tag }
          $commits = git log $range --no-merges --format='- %s (%h)'
          $changelog = if ($commits) { "## Changes`n`n" + ($commits -join "`n") + "`n`n" } else { "" }
          $notes = $changelog + $notes
          Set-Content -Path "$env:RUNNER_TEMP\release-notes.md" -Value $notes -Encoding utf8
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Daily Ship Helper
        shell: pwsh
        run: |
          .\DailyShipHelper\BuildDailyShipHelper.ps1
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item .\DailyShipHelper\DailyShipHelper.exe .\dist\DailyShipHelper.exe
          if (-not (Test-Path .\dist\DailyShipHelper.exe)) {
            throw "DailyShipHelper.exe was not created."
          }

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $notes = "$env:RUNNER_TEMP\release-notes.md"
          $assets = @("dist/DailyShipHelper.exe")
          $prerelease = if ($env:VERSION.Contains("-")) { @("--prerelease") } else { @() }

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --title $tag --notes-file $notes @prerelease
            if ($LASTEXITCODE -eq 0) {
              gh release upload $tag $assets --clobber
            }
          }
          else {
            gh release create $tag $assets --verify-tag --title $tag --notes-file $notes @prerelease
          }

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release publishing failed (exit code $LASTEXITCODE)"
          }
